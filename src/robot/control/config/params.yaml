# Keep the decimal points: these parameters are declared as doubles, and a bare integer
# (e.g. 1) would be read as an int and rejected at startup.
control_node:
  ros__parameters:
    # Speed and lookahead go together: a faster robot needs to look further ahead, or it overcorrects
    # and weaves. The slowdown distance grows with speed so it still brakes in time.
    # 1.5 m/s is the measured limit: the simulator applies speed changes instantly, and at 3 m/s the
    # light robot pitches up to 16 deg, tilting the lidar into the floor (phantom obstacles). At 1.5 m/s
    # pitch stays under ~3 deg. Going faster needs acceleration limiting in the controller first.
    linear_speed: 1.5           # cruising speed (m/s)
    lookahead_distance: 1.8     # steer toward the path point this far ahead (m)
    max_angular_speed: 1.5      # turn rate limit (rad/s)
    goal_tolerance: 0.3         # stop when the end of the path is this close (m)
    rotate_in_place_angle: 1.0  # turn on the spot when the target is more than this off heading (rad)
    slowdown_distance: 2.5      # start slowing down this far from the goal (m)
    min_speed_ratio: 0.25       # never slow below this fraction of linear_speed while driving
    lidar_to_axle: 1.3          # the odometry (lidar) frame is this far ahead of the wheel axle (m)
    control_rate_hz: 10.0       # how often a velocity command is sent
    odom_timeout_s: 0.5         # stop if odometry is older than this (s)
